# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "rel-*"
      - "release/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to run live QA against when running manually.
        required: true

concurrency:
  # Push runs get a per-COMMIT group and never cancel: the "Release Tag" ruleset
  # requires `test-and-build (ubuntu)` to be green on the exact commit release-please
  # tags (the release-PR merge commit), so a later push to main must not cancel an
  # earlier commit's checks. PR/dispatch runs keep cheap cancel-on-update.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  prepare-test-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build test matrix
        id: matrix
        run: |
          echo 'matrix={"include":[{"name":"ubuntu","os":"ubuntu-24.04","full_checks":true},{"name":"windows","os":"windows-latest","full_checks":false}]}' >> "$GITHUB_OUTPUT"

  test-and-build:
    needs:
      - prepare-test-matrix
    name: test-and-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-test-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Reject temporary artifacts in release PRs
        if: >-
          matrix.full_checks && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          set -euo pipefail
          artifacts="$(git ls-tree -r --name-only HEAD -- .pr)"
          if [ -n "$artifacts" ]; then
            echo "::error::Release PR contains temporary .pr artifacts. Merge the cleanup PR and let release-please update this PR before merging."
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.full_checks
        run: npm run lint
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@bf465a2f8f66e7225ed32003c1661ee984aa33d3
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          test-step: Test
          report: .jiffy/tests-vitest.json
      - name: "Replay farm: a directory for the test report"
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.jiffy"
          echo .jiffy/ >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Tensile vitest recorder
        id: tensile-record
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (matrix.full_checks) }}
        continue-on-error: true
        uses: rsyed94/tensile-action/vitest@bf465a2f8f66e7225ed32003c1661ee984aa33d3
        with:
          step: setup
      - name: Test
        if: matrix.full_checks
        run: npm test -- $TENSILE_VITEST_ARGS $TENSILE_REPORT_ARGS
        env:
          TENSILE_REPORT_ARGS: --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/.jiffy/tests-vitest.json
          TENSILE_VITEST_ARGS: ${{ steps.tensile-record.outputs.args }}
      - name: Tensile vitest collect
        if: ${{ !cancelled() && steps.tensile-record.outcome != 'skipped' }}
        continue-on-error: true
        uses: rsyed94/tensile-action/vitest@bf465a2f8f66e7225ed32003c1661ee984aa33d3
        with:
          step: collect
      - name: "Replay farm: send the coverage to Tensile"
        if: ${{ success() && steps.tensile-record.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SERVER: https://jiffy-app-production.up.railway.app
          PART: test-and-build
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE/.jiffy" 2>/dev/null || { echo "::warning::no .jiffy directory: nothing recorded"; exit 0; }
          parts=(coverage-*.json)
          [ ${#parts[@]} -gt 0 ] || { echo "::warning::no coverage to send"; exit 0; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | jq -r .value)
          echo "::add-mask::$token"
          put() { curl -sS --fail-with-body -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; echo; }
          for f in "${parts[@]}"; do case "$f" in *-nodes.json | *-nodes.always-run.json) continue;; esac; put "$f" parts "$PART-${f%.json}"; done
          for f in report-*.json; do put "$f" durations "$PART-${f%.json}"; done

      - name: Build app
        run: npm run build

      - name: Build library
        if: matrix.full_checks
        run: npm run build:lib

      - name: Verify package contents
        if: matrix.full_checks
        run: npm pack --dry-run
    permissions:
      contents: read
      id-token: write
