# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "rel-*"
      - "release/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to run live QA against when running manually.
        required: true

concurrency:
  # Push runs get a per-COMMIT group and never cancel: the "Release Tag" ruleset
  # requires `test-and-build (ubuntu)` to be green on the exact commit release-please
  # tags (the release-PR merge commit), so a later push to main must not cancel an
  # earlier commit's checks. PR/dispatch runs keep cheap cancel-on-update.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  prepare-test-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build test matrix
        id: matrix
        run: |
          echo 'matrix={"include":[{"name":"ubuntu","os":"ubuntu-24.04","full_checks":true},{"name":"windows","os":"windows-latest","full_checks":false}]}' >> "$GITHUB_OUTPUT"

  test-and-build:
    needs:
      - prepare-test-matrix
    name: test-and-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-test-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed 's/[][*?\\!#]/\\&/g')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Reject temporary artifacts in release PRs
        if: >-
          matrix.full_checks && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          set -euo pipefail
          artifacts="$(git ls-tree -r --name-only HEAD -- .pr)"
          if [ -n "$artifacts" ]; then
            echo "::error::Release PR contains temporary .pr artifacts. Merge the cleanup PR and let release-please update this PR before merging."
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.full_checks
        run: npm run lint

      - name: Test
        if: matrix.full_checks
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build library
        if: matrix.full_checks
        run: npm run build:lib

      - name: Verify package contents
        if: matrix.full_checks
        run: npm pack --dry-run
